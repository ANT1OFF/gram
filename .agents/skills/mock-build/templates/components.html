<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Template: one component or a small set, each board showing its variants and states at real
         size. Use it for a new control, a menu, a card or a dialog before it goes into a screen.
         Replace every [BRACKETED] fact or keep it as a visible gap. -->
    <title>[Component] · v1</title>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js" defer></script>
  </head>
  <body class="mock">
    <main class="mock-canvas">
      <p class="mock-note">[What the component is for, and where it will be used.]</p>

      <section class="board" data-name="Variants" data-size="640x360">
        <div class="board-frame">
          <div class="content">
            <div class="row wrap">
              <button class="btn primary" type="button">[Primary]</button>
              <button class="btn" type="button">[Secondary]</button>
              <button class="btn ghost" type="button">[Quiet]</button>
              <button class="btn danger" type="button">[Destructive]</button>
              <button class="btn" type="button" disabled>[Disabled]</button>
            </div>
            <div class="row wrap">
              <span class="badge">[Neutral]</span>
              <span class="badge accent">[Accent]</span>
              <span class="badge success">[Success]</span>
              <span class="badge warning">[Warning]</span>
              <span class="badge danger">[Danger]</span>
            </div>
            <div class="segmented" role="group" aria-label="[Choice]">
              <button type="button" aria-pressed="true">[One]</button>
              <button type="button" aria-pressed="false">[Two]</button>
              <button type="button" aria-pressed="false">[Three]</button>
            </div>
          </div>
        </div>
      </section>

      <section class="board" data-name="Menu" data-size="360x320">
        <div class="board-frame">
          <div class="content">
            <div class="menu" role="menu" aria-label="[Menu]">
              <button class="menu-item" role="menuitem" type="button">
                <i data-icon="copy"></i>[Action]<span class="kbd">⌘C</span>
              </button>
              <button class="menu-item" role="menuitem" type="button">
                <i data-icon="external"></i>[Action]
              </button>
              <div class="divider"></div>
              <button class="menu-item" role="menuitem" type="button">
                <i data-icon="trash"></i>[Destructive action]
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="board" data-name="Dialog" data-size="640x420" data-states="default,error">
        <div class="board-frame">
          <div class="scrim">
            <div class="dialog" role="dialog" aria-labelledby="dialog-title">
              <h3 id="dialog-title">[Dialog title]</h3>
              <p class="muted">[What this changes, in one or two sentences.]</p>
              <label class="field">
                [Field label]
                <input class="input" type="text" value="[Value]" data-when="default" />
                <input
                  class="input"
                  type="text"
                  value="[Bad value]"
                  aria-invalid="true"
                  data-when="error"
                />
                <span class="error" data-when="error">[What is wrong and how to fix it.]</span>
              </label>
              <div class="dialog-actions">
                <button class="btn ghost" type="button">Cancel</button>
                <button class="btn primary" type="button">[Confirm]</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
