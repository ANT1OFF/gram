name: Cancel closed pull request runs

# A merged or closed pull request's remaining checks are dead work: cancel those of its head
# commit. Only that commit's: a branch name is reused once a pull request merges, and a new pull
# request on the same branch has runs of its own that must go on. Its older commits need nothing
# here, since each workflow's concurrency already cancelled their runs.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cancel:
    if: github.event.pull_request.head.repo.full_name == github.repository
    # No checkout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELF: ${{ github.run_id }}
    steps:
      - run: |
          # A full commit hash, so it is safe inside the jq filter below.
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit: $HEAD_SHA"; exit 1; }
          for status in queued in_progress waiting pending requested; do
            gh api -X GET "repos/$GH_REPO/actions/runs" -f branch="$BRANCH" -f event=pull_request \
              -f status="$status" --paginate --jq ".workflow_runs[] | select(.head_sha == \"$HEAD_SHA\") | .id"
          done | sort -u | while read -r id; do
            [ "$id" = "$SELF" ] && continue
            echo "Cancelling run $id"
            # Force: a plain cancel still queues `if: always()` jobs.
            gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel" || true
          done
