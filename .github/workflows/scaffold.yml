name: Scaffold boundaries

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold:
    timeout-minutes: 5
    # Only trusted same-repository PRs may execute on owned hardware.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, gram-ci]
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.gram-bun-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.gram-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Use physical checkout directory
        run: test "$(pwd -P)" = "$PWD"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.node-version
      - run: node tools/check-public-scaffold.mjs
      - run: node tools/check-dependency-pins.mjs

      - name: Remove this job's checkout and download caches
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" "$BUN_INSTALL_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH"
