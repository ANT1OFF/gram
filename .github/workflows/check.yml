name: Application checks

on:
  # A pull request into an integration branch is checked once it lands there, by the push run:
  # checking each one as well left the runners too few for the branch's own runs.
  pull_request:
    branches-ignore: ["integration/**"]
  push:
    # An integration branch collects pull requests before main, so it is checked as main is.
    branches: [main, "integration/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs cancel. A run on main or an integration branch that starts finishes, and
  # only the newest push waits behind it, so a burst of merges still ends in a finished run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# GitHub-hosted arm64 runners. Every native dependency (sherpa-onnx, node-pty, Electron, the
# oxc/rolldown/lightningcss/tailwind bindings, native TypeScript) and Playwright's Chromium ship
# linux-arm64 builds.
#
# On a pull request, `classify` picks the lanes its diff can affect (packages/git/src/ci-policy.ts):
# prose alone runs only `docs`; other changes run `check static` and whichever of the Vitest, macOS
# package and e2e jobs they can reach. Main pushes and manual runs run every lane. `qualification`
# is the one stable result: a skipped job passes only when classification didn't select its lane.
jobs:
  classify:
    timeout-minutes: 5
    # Only same-repository PRs run CI.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      lanes: ${{ steps.classify.outputs.lanes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The event's merge commit, the same source the jobs' conditions come from: a branch's own
          # copy of the classifier never decides its lanes. Full history reaches base and head.
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: classify
        run: node tools/classify-ci.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_MERGE: ${{ github.sha }}

  docs:
    needs: classify
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.classify.outputs.kind == 'docs'
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: docs-source [base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }} merge=${{ github.sha }}]
        run: node tools/check-ci-source.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_MERGE: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run fmt:check

  # `bun run check:ci` split across runners: the static stages and bundle build in one job, and the
  # Vitest suite in shards beside it, so together they run every stage once.
  check-static:
    needs: classify
    name: check static
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'static')
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - run: bun install --frozen-lockfile
      # Check every project in the supported bounded compiler mode first. The static stages'
      # incremental typecheck then reuses only this same fresh checkout's successful build cache.
      - name: Typecheck within a bounded memory budget
        run: bun run typecheck --singleThreaded
        env:
          # Native TypeScript is Go: bound its heap so the typecheck stays predictable.
          GOMEMLIMIT: 2GiB
      - run: node tools/check/run.mjs --only static
      - run: bun run build:bundles

  check-tests:
    needs: classify
    name: check tests ${{ matrix.shard }}/2
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'tests')
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    env:
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - run: bun install --frozen-lockfile
      - run: node tools/check/run.mjs --only tests --shard "${{ matrix.shard }}/2"

  # The whole mock-API Playwright suite, in shards that run beside `check`. It includes the
  # subscription/onboarding smoke set, which no longer needs a job of its own. Each shard spends
  # about a minute and a half on setup and its preview build, so more shards cost little. The shards
  # are separate jobs sharing one step list, not a matrix: a skipped matrix reports one job under its
  # unexpanded name, and the merge policy's `alwaysJobs` name each shard.
  e2e-1:
    needs: classify
    name: e2e 1/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 1
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: gram-chromium-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      # --with-deps installs Chromium's system libraries even when the browser came from cache.
      - run: bun run playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run --filter @gram/web e2e --shard="$SHARD/8" --workers=1
        env:
          GRAM_E2E_SERVER: preview
      # The embeddable package's acceptance run, in one shard: the package is built as it ships and
      # mounted by a separate app that adds pages of its own (docs/EMBEDDED_WEB_APP.md).
      - name: Mount the embeddable package in another app
        if: env.SHARD == '1'
        run: bun run --filter @gram/web e2e:embed
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_attempt }}-shard-${{ env.SHARD }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-report-embed
            apps/web/test-results-embed
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload per-spec timings (including successful shards)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings-${{ github.run_attempt }}-shard-${{ env.SHARD }}
          path: apps/web/test-results/spec-timings.json
          retention-days: 14
          if-no-files-found: ignore

  e2e-2:
    needs: classify
    name: e2e 2/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 2
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  e2e-3:
    needs: classify
    name: e2e 3/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 3
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  e2e-4:
    needs: classify
    name: e2e 4/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 4
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  e2e-5:
    needs: classify
    name: e2e 5/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 5
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  e2e-6:
    needs: classify
    name: e2e 6/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 6
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  e2e-7:
    needs: classify
    name: e2e 7/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 7
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  e2e-8:
    needs: classify
    name: e2e 8/8
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHARD: 8
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps: *e2e-steps

  # The Vitest suite and an unsigned package on the platform Gram ships for, in parallel jobs: the
  # suite in three shards (in one job on this 3-core runner it took 14 minutes) and the package
  # beside them. Static stages are platform-independent and stay in `check static`. Packaging never
  # signs (see apps/desktop/electron-builder.yml), so no signing or notarization secret reaches CI.
  # The e2e shards stay on Linux: in series on this 3-core runner they would take over an hour.
  macos-tests:
    needs: classify
    name: macos tests ${{ matrix.shard }}/3
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'tests')
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - run: bun install --frozen-lockfile
      - run: node tools/check/run.mjs --only tests --shard "${{ matrix.shard }}/3"

  macos-package:
    needs: classify
    name: macos package
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'package')
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - name: Identify packaging download versions
        id: packaging-cache
        run: node tools/packaging/cache.mjs --key
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: gram-packaging-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.packaging-cache.outputs.versions }}
      - run: bun install --frozen-lockfile
      - name: Seed pinned Electron checksums for offline cache validation
        run: node tools/packaging/cache.mjs --seed-checksums
      - run: bun run build:bundles
      - name: Package the unsigned app
        run: node ../../tools/packaging/retry.mjs bun run electron-builder --dir --publish never
        working-directory: apps/desktop
      - run: bun run verify:package
        working-directory: apps/desktop

  # The Linux x64 AppImage and .deb, on the `package` lane beside `macos package`. node-pty has no
  # Linux prebuilds, so the job compiles it against Electron's headers before packaging. The verifier
  # checks the unpacked app, both artifacts and node-pty loading in the packaged Electron; the .deb
  # is then installed here (Ubuntu 24.04) and in a Debian 12 container, and the installed app and
  # the AppImage each run `--smoke` under Xvfb with fake agents and temporary stores. Nothing is
  # published or signed: the artifacts are uploaded to this run only, with no write token.
  linux-package:
    needs: classify
    name: linux package
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(needs.classify.outputs.lanes), 'package')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - name: Identify packaging download versions
        id: packaging-cache
        run: node tools/packaging/cache.mjs --key
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: gram-packaging-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.packaging-cache.outputs.versions }}
      - run: bun install --frozen-lockfile
      - name: Seed pinned Electron checksums for offline cache validation
        run: node tools/packaging/cache.mjs --seed-checksums
      - run: bun run build:bundles
      - name: Compile node-pty against Electron's headers
        run: bun run rebuild:node-pty
        working-directory: apps/desktop
      - name: Package the AppImage and .deb
        run: node ../../tools/packaging/retry.mjs bun run electron-builder --linux --x64 --publish never
        working-directory: apps/desktop
      - run: bun run verify:package
        working-directory: apps/desktop
      - name: Install the .deb on Ubuntu 24.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth ./apps/desktop/release/gram_*_amd64.deb
          missing=$(ldd /opt/Gram/gram | grep "not found" || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
      - name: Install the .deb on Debian 12 and load node-pty and sherpa-onnx there
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ./apps/desktop/release/gram_*_amd64.deb >/dev/null
              unpacked=/opt/Gram/resources/app.asar.unpacked/node_modules
              missing=$(ldd /opt/Gram/gram "$unpacked/node-pty/build/Release/pty.node" \
                "$unpacked"/sherpa-onnx-linux-x64/*.so "$unpacked/sherpa-onnx-linux-x64/sherpa-onnx.node" \
                | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
              scratch=$(mktemp -d)
              ELECTRON_RUN_AS_NODE=1 /opt/Gram/gram tools/release-rc/native-probe.cjs \
                /opt/Gram/resources/app.asar "$scratch" GRAM_DEBIAN_12 watch'
      - name: Smoke the installed app and the AppImage under Xvfb
        run: |
          for app in /opt/Gram/gram "$PWD/apps/desktop/release/gram_"*"_x86_64.AppImage"; do
            work=$(mktemp -d)
            mkdir -p "$work/stubs" "$work/home" "$work/tmp"
            # No agent CLI or GitHub login reaches the smoke: these stand in for them.
            for cli in claude codex gh; do
              printf '#!/bin/sh\nexit 127\n' >"$work/stubs/$cli"
              chmod +x "$work/stubs/$cli"
            done
            args=(--smoke --password-store=basic "--user-data-dir=$work/electron")
            # The AppImage runs from its own extraction: the runner has no FUSE 2.
            case "$app" in *.AppImage) args=(--appimage-extract-and-run "${args[@]}") ;; esac
            echo "::group::$app --smoke"
            env -i PATH="$work/stubs:/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
              XDG_CONFIG_HOME="$work/xdg-config" XDG_DATA_HOME="$work/xdg-data" \
              XDG_CACHE_HOME="$work/xdg-cache" CODEX_HOME="$work/codex" \
              CLAUDE_CONFIG_DIR="$work/claude" GH_CONFIG_DIR="$work/gh" GRAM_DATA_DIR="$work/gram" \
              GRAM_FAKE_AGENT=1 GRAM_FAKE_AGENT_REPLY=echo CI=1 LANG=C.UTF-8 \
              timeout 150 xvfb-run -a "$app" "${args[@]}" 2>&1 | tee "$work/smoke.log" || true
            echo "::endgroup::"
            grep -q "SMOKE OK" "$work/smoke.log" || { echo "$app: no SMOKE OK"; exit 1; }
          done
      - name: Upload the AppImage and .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gram-linux-x64-${{ github.run_attempt }}
          path: |
            apps/desktop/release/gram_*_x86_64.AppImage
            apps/desktop/release/gram_*_amd64.deb
          retention-days: 7
          if-no-files-found: error

  qualification:
    needs:
      [
        classify,
        docs,
        check-static,
        check-tests,
        macos-tests,
        macos-package,
        linux-package,
        e2e-1,
        e2e-2,
        e2e-3,
        e2e-4,
        e2e-5,
        e2e-6,
        e2e-7,
        e2e-8,
      ]
    # On a pull request it always reports, so a cancelled run never reads as a skipped, passing
    # required check. On a push it skips a cancelled run: `always()` queued it even then, and the
    # run held its concurrency slot until a runner came free, so the next push's run waited.
    if: >-
      (github.event_name == 'pull_request' && always()
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && !cancelled())
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node tools/qualify-ci.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
