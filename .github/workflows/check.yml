name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs cancel; every main run that starts finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# GitHub-hosted arm64 runners. Every native dependency (sherpa-onnx, node-pty, Electron, the
# oxc/rolldown/lightningcss/tailwind bindings, native TypeScript) and Playwright's Chromium ship
# linux-arm64 builds.
jobs:
  classify:
    timeout-minutes: 5
    # Only same-repository PRs run CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: classify
        run: node tools/classify-ci.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

  docs:
    needs: classify
    if: needs.classify.outputs.kind == 'docs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: docs-source [base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }} merge=${{ github.sha }}]
        run: node tools/check-ci-source.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_MERGE: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run fmt:check

  check:
    needs: classify
    timeout-minutes: 30
    # Only same-repository PRs run CI.
    if: needs.classify.outputs.kind == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - run: bun install --frozen-lockfile
      # Check every project in the supported bounded compiler mode first. check:ci's normal
      # incremental typecheck then reuses only this same fresh checkout's successful build cache.
      - name: Typecheck within a bounded memory budget
        run: bun run typecheck --singleThreaded
        env:
          # Native TypeScript is Go: bound its heap so the typecheck stays predictable.
          GOMEMLIMIT: 2GiB
      - run: bun run check:ci

  # The whole mock-API Playwright suite, in shards that run beside `check`. It includes the
  # subscription/onboarding smoke set, which no longer needs a job of its own.
  e2e:
    needs: classify
    name: e2e ${{ matrix.shard }}/3
    # Only same-repository PRs run CI.
    if: needs.classify.outputs.kind == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      # Every shard reports, so one red shard doesn't hide another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      # Keep Vite's localhost binding consistent with Node fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Cache downloads only, never source or build results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: gram-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.bun-version', '.node-version') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: gram-chromium-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      # --with-deps installs Chromium's system libraries even when the browser came from cache.
      - run: bun run playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run --filter @gram/web e2e --shard=${{ matrix.shard }}/3 --workers=1
        env:
          GRAM_E2E_SERVER: preview
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload per-spec timings (including successful shards)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: apps/web/test-results/spec-timings.json
          retention-days: 14
          if-no-files-found: ignore

  qualification:
    needs: [classify, docs, check, e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node tools/qualify-ci.mjs
        env:
          CI_KIND: ${{ needs.classify.outputs.kind }}
          CI_CLASSIFY_RESULT: ${{ needs.classify.result }}
          CI_DOCS_RESULT: ${{ needs.docs.result }}
          CI_CHECK_RESULT: ${{ needs.check.result }}
          CI_E2E_RESULT: ${{ needs.e2e.result }}
