name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    timeout-minutes: 5
    # Only trusted same-repository PRs may execute on owned hardware.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, gram-ci]
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Use physical checkout directory
        run: test "$(pwd -P)" = "$PWD"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.node-version
      - id: classify
        run: node tools/classify-ci.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Remove this job's checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

  docs:
    needs: classify
    if: needs.classify.outputs.kind == 'docs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64, gram-ci]
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.gram-bun-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.gram-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Use physical checkout directory
        run: test "$(pwd -P)" = "$PWD"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.node-version
      - name: docs-source [base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }} merge=${{ github.sha }}]
        run: node tools/check-ci-source.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_MERGE: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run fmt:check
      - name: Remove this job's checkout and download caches
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" "$BUN_INSTALL_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH"

  check:
    needs: classify
    timeout-minutes: 30
    # Only trusted same-repository PRs may execute on owned hardware.
    if: needs.classify.outputs.kind == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, gram-ci]
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    env:
      # Docker has IPv6 loopback without a routed IPv6 interface; align bind/fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.gram-bun-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.gram-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Use physical checkout directory
        run: test "$(pwd -P)" = "$PWD"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.bun-version
      # actions/cache hashes its path too: cache stable staging paths, then copy downloads
      # into the existing per-job writable directory. Never cache source/build results.
      - name: Clear this runner's cache staging
        env:
          GRAM_CI_CACHE_ROOT: ${{ runner.temp }}/gram-download-cache-${{ runner.name }}
        run: |
          printf 'GRAM_CI_CACHE_ROOT=%s\n' "$GRAM_CI_CACHE_ROOT" >> "$GITHUB_ENV"
          rm -rf -- "$GRAM_CI_CACHE_ROOT"
      - uses: actions/cache/restore@v6
        id: bun-cache
        with:
          path: ${{ env.GRAM_CI_CACHE_ROOT }}/bun
          key: gram-bun-v1-${{ runner.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('ci-{0}-{1}-{2}/bun.lock', github.run_id, github.run_attempt, github.job), format('ci-{0}-{1}-{2}/.bun-version', github.run_id, github.run_attempt, github.job), format('ci-{0}-{1}-{2}/.node-version', github.run_id, github.run_attempt, github.job)) }}
      - name: Seed this job's Bun downloads
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          if test -d "$GRAM_CI_CACHE_ROOT/bun"; then
            cp -a "$GRAM_CI_CACHE_ROOT/bun/." "$BUN_INSTALL_CACHE_DIR/"
          fi
      - run: bun install --frozen-lockfile
      # Check every project in the supported bounded compiler mode first. check:ci's normal
      # incremental typecheck then reuses only this same fresh checkout's successful build cache.
      - name: Typecheck within runner memory budget
        run: bun run typecheck --singleThreaded
        env:
          # Native TypeScript is Go: leave headroom within the 4 GiB CI runner.
          GOMEMLIMIT: 2GiB
      - run: bun run check:ci

      # Copy back and save before unconditional cleanup removes owned directories.
      - name: Stage Bun downloads for saving
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GRAM_CI_CACHE_ROOT/bun"
          cp -a "$BUN_INSTALL_CACHE_DIR/." "$GRAM_CI_CACHE_ROOT/bun/"
      - uses: actions/cache/save@v6
        if: steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.GRAM_CI_CACHE_ROOT }}/bun
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Remove this job's checkout and download caches
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" "$BUN_INSTALL_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" "$GRAM_CI_CACHE_ROOT"

  # The whole mock-API Playwright suite, in shards that run beside `check`. It includes the
  # subscription/onboarding smoke set, which no longer needs a job of its own.
  e2e:
    needs: classify
    name: e2e ${{ matrix.shard }}/3
    # Only trusted same-repository PRs may execute on owned hardware.
    if: needs.classify.outputs.kind == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, gram-ci]
    # A shard's specs take 20 to 30 minutes on these runners.
    timeout-minutes: 45
    strategy:
      # Every shard reports, so one red shard doesn't hide another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
    env:
      # Keep Vite localhost binding consistent with Node fetch in this container.
      NODE_OPTIONS: --dns-result-order=ipv4first
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.gram-bun-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.gram-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
      - name: Use physical checkout directory
        run: test "$(pwd -P)" = "$PWD"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}/.node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}/.bun-version
      # actions/cache hashes its path too: cache stable staging paths, then copy downloads
      # into the existing per-job writable directory. Never cache source/build results.
      - name: Clear this runner's cache staging
        env:
          GRAM_CI_CACHE_ROOT: ${{ runner.temp }}/gram-download-cache-${{ runner.name }}
        run: |
          printf 'GRAM_CI_CACHE_ROOT=%s\n' "$GRAM_CI_CACHE_ROOT" >> "$GITHUB_ENV"
          rm -rf -- "$GRAM_CI_CACHE_ROOT"
      - uses: actions/cache/restore@v6
        id: bun-cache
        with:
          path: ${{ env.GRAM_CI_CACHE_ROOT }}/bun
          key: gram-bun-v1-${{ runner.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('ci-{0}-{1}-{2}-{3}/bun.lock', github.run_id, github.run_attempt, github.job, matrix.shard), format('ci-{0}-{1}-{2}-{3}/.bun-version', github.run_id, github.run_attempt, github.job, matrix.shard), format('ci-{0}-{1}-{2}-{3}/.node-version', github.run_id, github.run_attempt, github.job, matrix.shard)) }}
      - name: Seed this job's Bun downloads
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          if test -d "$GRAM_CI_CACHE_ROOT/bun"; then
            cp -a "$GRAM_CI_CACHE_ROOT/bun/." "$BUN_INSTALL_CACHE_DIR/"
          fi
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        id: browser-cache
        with:
          path: ${{ env.GRAM_CI_CACHE_ROOT }}/chromium
          key: gram-chromium-v1-${{ runner.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('ci-{0}-{1}-{2}-{3}/bun.lock', github.run_id, github.run_attempt, github.job, matrix.shard), format('ci-{0}-{1}-{2}-{3}/.bun-version', github.run_id, github.run_attempt, github.job, matrix.shard), format('ci-{0}-{1}-{2}-{3}/.node-version', github.run_id, github.run_attempt, github.job, matrix.shard)) }}
      - name: Seed this job's browser downloads
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          if test -d "$GRAM_CI_CACHE_ROOT/chromium"; then
            cp -a "$GRAM_CI_CACHE_ROOT/chromium/." "$PLAYWRIGHT_BROWSERS_PATH/"
          fi
      - run: bun run playwright install --with-deps chromium
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}/apps/web
      - run: bun run --filter @gram/web e2e --shard=${{ matrix.shard }}/3 --workers=1
        env:
          GRAM_E2E_SERVER: preview
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}/apps/web/playwright-report
            ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}/apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload per-spec timings (including successful shards)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}/apps/web/test-results/spec-timings.json
          retention-days: 14
          if-no-files-found: ignore
      # Copy back and save before unconditional cleanup removes owned directories.
      - name: Stage Bun downloads for saving
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GRAM_CI_CACHE_ROOT/bun"
          cp -a "$BUN_INSTALL_CACHE_DIR/." "$GRAM_CI_CACHE_ROOT/bun/"
      - uses: actions/cache/save@v6
        if: steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.GRAM_CI_CACHE_ROOT }}/bun
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Stage browser downloads for saving
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GRAM_CI_CACHE_ROOT/chromium"
          cp -a "$PLAYWRIGHT_BROWSERS_PATH/." "$GRAM_CI_CACHE_ROOT/chromium/"
      - uses: actions/cache/save@v6
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.GRAM_CI_CACHE_ROOT }}/chromium
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Remove this job's checkout and download caches
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}" "$BUN_INSTALL_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" "$GRAM_CI_CACHE_ROOT"

  qualification:
    needs: [classify, docs, check, e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64, gram-ci]
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Use physical checkout directory
        run: test "$(pwd -P)" = "$PWD"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.node-version
      - run: node tools/qualify-ci.mjs
        env:
          CI_KIND: ${{ needs.classify.outputs.kind }}
          CI_CLASSIFY_RESULT: ${{ needs.classify.result }}
          CI_DOCS_RESULT: ${{ needs.docs.result }}
          CI_CHECK_RESULT: ${{ needs.check.result }}
          CI_E2E_RESULT: ${{ needs.e2e.result }}
      - name: Remove this job's checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
