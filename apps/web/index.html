<!doctype html>
<html
  lang="en"
  data-look="glass"
  data-palette="neutral-dark"
  data-mode="dark"
  data-motion="system"
  data-theme-booting
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gram</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" href="/gram-icon.png" sizes="256x256" />
    <script>
      // First paint in the stored theme rather than the defaults above, so nothing fades into it.
      // ThemeRoot finishes the job (palette pairing, contrast) and clears data-theme-booting.
      try {
        var state = JSON.parse(localStorage.getItem("gram.theme") || "{}").state || {};
        var root = document.documentElement;
        var mode = state.mode === "light" || state.mode === "dark" ? state.mode : "dark";
        if (state.mode === "system" && typeof matchMedia === "function")
          mode = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.dataset.mode = mode;
        // Each preset dark palette's light partner, as `@gram/themes` pairs them (boot-pairs.test.ts
        // keeps this in step): a palette stored in the other mode paints as its partner, the way
        // ThemeRoot will, rather than in the wrong mode until it does.
        var lightOf = {
          "tokyo-night": "tokyo-light",
          "catppuccin-mocha": "catppuccin-latte",
          "minimal-ocean-dark": "minimal-ocean",
          "minimal-grape-dark": "minimal-grape",
          "minimal-forest-dark": "minimal-forest",
          "minimal-sunset-dark": "minimal-sunset",
          "minimal-vivid-dark": "minimal-vivid",
          "minimal-graphite-dark": "minimal-graphite",
          "neutral-dark": "neutral",
          "rose-dark": "rose",
          "forest-dark": "forest",
          "ocean-dark": "ocean",
          "ember-dark": "ember",
          "violet-dark": "violet",
        };
        // An unset palette is the default, `neutral-dark`, paired the same way.
        var stored =
          typeof state.palette === "string" && state.palette ? state.palette : "neutral-dark";
        var paired = stored;
        if (mode === "light" && lightOf[stored]) paired = lightOf[stored];
        if (mode === "dark") for (var dark in lightOf) if (lightOf[dark] === stored) paired = dark;
        root.dataset.palette = paired;
        if (/^(reduced|off)$/.test(state.motion)) root.dataset.motion = state.motion;
      } catch (error) {}
    </script>
    <script src="/asset-guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
