electronVersion: 45.2.3 # Keep in sync with the root catalog; electron-builder cannot resolve catalog: with Bun.
# Packaging is unsigned; `bun run release:rc` then signs, notarizes and staples the packaged app
# with apps/desktop/scripts/sign-mac.mjs when the publisher's Developer ID is set up.
appId: io.github.ant1off.gram
productName: Gram

directories:
  output: release
  buildResources: build

# Ship node-pty's N-API prebuilds. A rebuild compiles them from source (needs Xcode CLT / MSVC),
# and node-pty then prefers build/Release over prebuilds.
npmRebuild: false

afterPack: ./build/afterPack.cjs

# Electron's fuses, flipped in the packaged binary after afterPack and before any signing;
# verify-package.mjs asserts each one. ASAR integrity checks app.asar against the hash
# electron-builder writes in Info.plist (macOS) or the exe's resources (Windows).
electronFuses:
  # The release tool's native probe (tools/release-rc/native-probe.cjs) runs the packaged app as
  # Node through ELECTRON_RUN_AS_NODE; nothing in the app does any more. Turning it off needs the
  # probe moved first.
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Electron's default, kept: turning it on is one-way for every profile's cookie store, so it
  # needs its own decision.
  enableCookieEncryption: false
  # Flipping a fuse breaks the linker's ad-hoc signature, which arm64 macOS refuses to run.
  # sign-mac.mjs replaces it with the Developer ID signature.
  resetAdHocDarwinSignature: true

files:
  - out/**
  - package.json
  - "!**/node_modules/node-pty/{deps,scripts,src,third_party,typings}/**"
  - "!**/node_modules/node-pty/binding.gyp"
  - "!**/node_modules/node-pty/build/Release/{obj,obj.target}/**"
  # C++ headers node-pty only needs to compile from source; it ships prebuilds.
  - "!**/node_modules/node-addon-api/**"
  # The Agent SDK's bundled Claude Code binaries; Gram runs the user's installed `claude`.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/*.{pdb,cc,hh,h}"
  - "!**/node_modules/node-pty/lib/**/*.test.js{,.map}"

asar: true
asarUnpack:
  - "**/node_modules/node-pty/**"
  # sherpa-onnx's addon and the dylibs/DLLs it links (ONNX Runtime among them) have to be real files
  # to load, and the JS beside it requires the addon by relative path, so the whole package goes.
  - "**/node_modules/sherpa-onnx-*/**"

extraResources:
  - from: ../web/dist
    to: web
  # electron-updater's cache directory name for signed updates; see the file.
  - from: build/app-update.yml
    to: app-update.yml
  # Generated by `bun run build` from what the bundles carry (tools/notices/generate.mjs); Settings →
  # Help opens it. afterPack fails a package without it.
  - from: ../../out/notices/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

mac:
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # The Gift rune (assets/app-icons); regenerate with `bun run generate:icon` in apps/desktop.
  icon: build/icon.icns
  # Packaging never signs: the signer runs as its own step with your keychain, outside the
  # isolated HOME the build uses. It applies the hardened runtime and these entitlements.
  identity: null
  hardenedRuntime: true
  # JIT for V8, and the microphone for dictation; nothing else. Every nested binary is signed by the
  # same team, so library validation stays on.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # What macOS shows when local dictation first opens the microphone; Electron's own placeholder
  # ("This app needs access to the microphone") otherwise.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Gram uses the microphone while you dictate into the composer, and between
      dictations only if you turn on Keep microphone ready. Speech is transcribed on
      this Mac and never leaves it.
  # electron-builder matches the app's own files against a platform's `files` first, and gives a list
  # of only exclusions a `**/*` include, which packed src/, the tests and the configs. So each
  # platform repeats the includes; verify-package.mjs fails the build if they go.
  files:
    - out/**
    - package.json
    - "!**/node_modules/node-pty/build/**"
    - "!**/node_modules/node-pty/prebuilds/{darwin-x64,win32-*}/**"
    - "!**/node_modules/sherpa-onnx-{darwin-x64,linux-*,win-*}/**"

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Repeats the includes, as `mac.files` does.
  files:
    - out/**
    - package.json
    - "!**/node_modules/node-pty/build/**"
    - "!**/node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**"
    - "!**/node_modules/sherpa-onnx-{darwin-*,linux-*,win-arm64,win-ia32}/**"

nsis:
  # The updater downloads the installer by exactly this name, with the x64 arch (`INSTALLER_PATTERN`
  # in packages/shell/src/modules/update/config.ts), and release.yml collects it by it; the shape is package-mac.sh's.
  artifactName: gram_${version}_${arch}-setup.${ext}
  # The differential package is for electron-updater, which downloads the blocks of an installer
  # that changed. Gram's updater (packages/shell/src/modules/update) fetches the whole file with `gh`, so the
  # block map is never read, and building for it has a cost: electron-builder then fixes the
  # compression itself (non-solid, 1 MB dictionary) and ignores `compression`, which is what ci.yml
  # sets to `store` to skip 75 s of 7-Zip on every PR.
  differentialPackage: false
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

# x64 only. Local dictation ships sherpa-onnx-linux-x64 with its addon and C APIs replaced by the
# TTS-free build in tools/sherpa-onnx/linux-x64 (the root postinstall puts it in place; afterPack
# and verify-package.mjs fail a package whose files differ from it). node-pty has no Linux
# prebuilds: the packaging job compiles build/Release/pty.node against Electron's headers first
# (scripts/rebuild-node-pty.mjs), and npmRebuild stays off.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: gram
  # The Gift rune at the hicolor sizes, as `bun run generate:icon` writes them.
  icon: build/icons
  category: Development
  synopsis: Desktop workspace for your own Claude Code and Codex CLIs
  # Also the desktop entry's Comment, which `desktop.entry` can't override.
  description: Run the Claude Code and Codex CLIs you installed, on your own subscriptions.
  maintainer: Gram contributors <32440065+ANT1OFF@users.noreply.github.com>
  vendor: Gram contributors
  # Electron 45 takes both the X11 WM_CLASS and the Wayland app_id from package.json's desktopName
  # (gram.desktop); this names the installed entry after it, so StartupWMClass is `gram` too.
  syncDesktopName: true
  desktop:
    entry:
      Keywords: claude;codex;agent;terminal;git;
  # ${arch} is each format's own name for x64: gram_<version>_amd64.deb, _x86_64.AppImage.
  artifactName: gram_${version}_${arch}.${ext}
  # Git watching on Linux: Node's recursive fs.watch is too slow there (packages/git/src/watch.ts),
  # and the server imports this at runtime. In resources/node_modules, which Node reaches after
  # app.asar/node_modules, so it stays out of package.json and out of the macOS and Windows
  # packages. These are @parcel/watcher's runtime packages; verify-package.mjs loads them.
  extraResources:
    - from: ../../node_modules/@parcel/watcher
      to: node_modules/@parcel/watcher
      filter: ["**/*", "!src/**", "!scripts/**"]
    - from: ../../node_modules/@parcel/watcher-linux-x64-glibc
      to: node_modules/@parcel/watcher-linux-x64-glibc
    - from: ../../node_modules/detect-libc
      to: node_modules/detect-libc
    - from: ../../node_modules/is-extglob
      to: node_modules/is-extglob
    - from: ../../node_modules/is-glob
      to: node_modules/is-glob
    - from: ../../node_modules/picomatch
      to: node_modules/picomatch
  # Repeats the includes, as `mac.files` does. node-pty keeps only build/Release/pty.node (the gyp
  # Makefiles and config.gypi name the build machine's paths).
  files:
    - out/**
    - package.json
    - "!**/node_modules/node-pty/prebuilds/**"
    - "!**/node_modules/node-pty/build/{Makefile,config.gypi,*.mk,node_gyp_bins}"
    - "!**/node_modules/node-pty/build/node_gyp_bins/**"
    - "!**/node_modules/node-pty/build/Release/{.deps,node-addon-api,obj.target,obj,test}/**"
    - "!**/node_modules/node-pty/build/Release/*.{a,o,d}"
    - "!**/node_modules/sherpa-onnx-{darwin-*,linux-arm64,win-*}/**"

appImage:
  # The AppImage carries its libraries but uses the host's FUSE 2 to mount itself (libfuse2, or
  # libfuse2t64 on Ubuntu 24.04+); `--appimage-extract-and-run` works without it.
  artifactName: gram_${version}_${arch}.${ext}
  # electron-builder's legacy AppImage writes `Exec=AppRun --no-sandbox`, turning Chromium's sandbox
  # off on every launch. Without it, its AppRun adds the flag only where the kernel refuses
  # unprivileged user namespaces (`unshare -Ur true` fails), which a squashfs mount can't replace
  # with a setuid chrome-sandbox. verify-package.mjs checks the entry.
  executableArgs: []

deb:
  # Debian package names are lowercase; electron-builder would take the scoped name's productName.
  packageName: gram
  # What Electron 45's binary links (`objdump -p`: GTK 3, NSS, ATK/AT-SPI, CUPS, D-Bus, X11/XCB,
  # GBM, ALSA, udev) plus what Chromium opens at runtime: libsecret for the keyring safeStorage
  # uses, libnotify for notifications, xdg-utils to open links. The names are Debian 12's; Ubuntu
  # 24.04's t64 libraries provide them. CI installs the .deb on both.
  depends:
    - libasound2
    - libatk-bridge2.0-0
    - libatk1.0-0
    - libatspi2.0-0
    - libc6
    - libcairo2
    - libcups2
    - libdbus-1-3
    - libexpat1
    - libgbm1
    - libgcc-s1
    - libglib2.0-0
    - libgtk-3-0
    - libnotify4
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libsecret-1-0
    - libudev1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
    - xdg-utils
  # Worktrees and diffs need git; the agent CLIs are the user's own installs, never a dependency.
  recommends:
    - git
